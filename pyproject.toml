[project]
name = "qr-cow-mcp"
version = "0.1.1"
description = "MCP server for qr-cow: create, style, and manage QR codes (with scan analytics) from Claude, Cursor, Zed, or any MCP client."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "HSN family", email = "hi@qr-cow.com" }]
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "qr-code", "qr", "claude", "ai-tools"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  # <2: mcp 2.0 removed the decorator-based low-level Server API
  # (list_tools/call_tool) this server is written against; a fresh
  # resolve (uvx) would crash on import without the cap.
  "mcp>=1.0.0,<2",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://qr-cow.com"
Documentation = "https://qr-cow.com/docs"
Repository = "https://github.com/qrcow/qr_cow_mcp"
Issues = "https://github.com/qrcow/qr_cow_mcp/issues"
Changelog = "https://github.com/qrcow/qr_cow_mcp/blob/main/CHANGELOG.md"

[project.scripts]
qr-cow-mcp = "qr_cow_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
